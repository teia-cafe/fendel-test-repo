name: Refresh and deploy gallery

on:
  push:
    branches: [main]
  schedule:
    # Every six hours. On-chain mints arrive at roughly 200/month, so this is
    # already far more often than the feed actually changes.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Number of recent mints to include
        default: '300'

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generative artifacts are screenshotted during the build, so the browser
      # is a build dependency rather than something visitors need.
      - run: npx playwright install --with-deps chromium

      - run: npm run fetch -- --limit ${{ inputs.limit || '300' }}

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
